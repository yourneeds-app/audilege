plugins {
    id 'com.android.application' version '8.9.2'
    id 'org.jetbrains.kotlin.android' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
}
android {
    namespace 'app.yourneeds.foliocue'
    compileSdk 35
    defaultConfig {
        applicationId 'app.yourneeds.foliocue'
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName '0.4.6'
    }
    buildFeatures { compose true }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    constraints { implementation 'androidx.exifinterface:exifinterface:1.4.1' }
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation('androidx.compose.material3:material3-android:1.3.2') {
        exclude group: 'androidx.compose.material', module: 'material-icons-core'
        exclude group: 'androidx.compose.material', module: 'material-ripple'
    }
    implementation 'androidx.compose.material:material-icons-core-android:1.7.8'
    implementation 'androidx.compose.material:material-ripple-android:1.8.0'
    implementation 'androidx.compose.foundation:foundation-android:1.8.0'
    implementation 'androidx.compose.ui:ui-android:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20180813'
}

name: Import verified Audilege snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed source files
        run: |
          set -euo pipefail
          echo '28466ece2411dc413b5c141368a8428e2deb5d2897b5d8ecb16286eeb6faeb9c audilege-source.zip' | sha256sum --check
          unzip -oq audilege-source.zip
          git rm audilege-source.zip
          git add .gitignore README.md RELEASING.md settings.gradle gradle.properties app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refine Android controls and update checks in Audilege 0.3.1'
          git push origin HEAD:main

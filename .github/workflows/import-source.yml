name: Import verified Audilege snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed source files
        run: |
          set -euo pipefail
          echo 'ad7492288a826a230498ad8a7947c94afe26c465d76cc290e8c49556313e490c audilege-source.zip' | sha256sum --check
          unzip -oq audilege-source.zip
          git rm audilege-source.zip
          git add .gitignore README.md RELEASING.md settings.gradle gradle.properties app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish reader controls and word highlighting in Audilege 0.3.2'
          git push origin HEAD:main

name: Import verified Audilege snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed source files
        run: |
          set -euo pipefail
          echo 'e5adaf1fa147688029d8221820f561aefe5c50acfc467e0badaba3ca9a1fa737 audilege-source.zip' | sha256sum --check
          unzip -oq audilege-source.zip
          git rm audilege-source.zip
          git add .gitignore README.md RELEASING.md settings.gradle gradle.properties app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add BookOrbit streaming and reader settings in Audilege 0.3.0'
          git push origin HEAD:main
